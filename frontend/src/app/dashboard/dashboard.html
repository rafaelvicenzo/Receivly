<div class="content">

  <!-- METRICS GRID -->
  <div class="metrics-grid">
    <div class="metric-card" *ngFor="let m of metrics" [ngClass]="'card-' + m.color">
      <div class="metric-top">
        <span class="metric-label">{{ m.label }}</span>
        <div class="metric-icon" [ngClass]="'icon-' + m.color">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <ng-container *ngIf="m.icon === 'trending-up'">
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
              <polyline points="17 6 23 6 23 12"/>
            </ng-container>
            <ng-container *ngIf="m.icon === 'alert-circle'">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </ng-container>
            <ng-container *ngIf="m.icon === 'check-circle'">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </ng-container>
            <ng-container *ngIf="m.icon === 'chart-pie'">
              <path d="M21.21 15.89A10 10 0 1 1 8 2.83"/>
              <path d="M22 12A10 10 0 0 0 12 2v10z"/>
            </ng-container>
          </svg>
        </div>
      </div>
      <div class="metric-value">{{ m.value }}</div>
      <div class="metric-bottom">
        <span class="metric-change" [ngClass]="m.positive ? 'positive' : 'negative'">
          {{ m.change }}
        </span>
        <span class="metric-sub">{{ m.sub }}</span>
      </div>
    </div>
  </div>

  <!-- BOTTOM GRID -->
  <div class="bottom-grid">

    <!-- RECENT CHARGES TABLE -->
    <div class="card table-card">
      <div class="card-header">
        <h3>Cobranças Recentes</h3>
        <button class="ver-todas">Ver todas</button>
      </div>
      <table class="charges-table">
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Valor</th>
            <th>Vencimento</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of recentCharges">
            <td class="client-cell">
              <div class="client-avatar">{{ c.client.charAt(0) }}</div>
              <span>{{ c.client }}</span>
            </td>
            <td class="value-cell">{{ c.value }}</td>
            <td class="date-cell">{{ c.due }}</td>
            <td>
              <span class="status-badge" [ngClass]="getStatusClass(c.status)">
                {{ getStatusLabel(c.status) }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- QUICK ACTIONS -->
    <div class="card actions-card">
      <div class="card-header">
        <h3>Ações Rápidas</h3>
      </div>
      <div class="actions-list">
        <button class="action-item">
          <div class="action-icon icon-blue">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </div>
          <div class="action-text">
            <span class="action-title">Nova Cobrança</span>
            <span class="action-desc">Criar cobrança manual</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" class="action-arrow">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
        <button class="action-item">
          <div class="action-icon icon-green">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
            </svg>
          </div>
          <div class="action-text">
            <span class="action-title">Gerar Pix</span>
            <span class="action-desc">Cobrança via Pix</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" class="action-arrow">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
        <button class="action-item">
          <div class="action-icon icon-amber">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14,2 14,8 20,8"/>
            </svg>
          </div>
          <div class="action-text">
            <span class="action-title">Emitir Boleto</span>
            <span class="action-desc">Boleto bancário</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" class="action-arrow">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
        <button class="action-item">
          <div class="action-icon icon-red">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.99 12 19.79 19.79 0 0 1 1.93 3.35 2 2 0 0 1 3.91 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 8.91a16 16 0 0 0 5.99 6l1.17-1.17a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </div>
          <div class="action-text">
            <span class="action-title">Régua de Cobrança</span>
            <span class="action-desc">Automatizar notificações</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" class="action-arrow">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
        <button class="action-item">
          <div class="action-icon icon-purple">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <div class="action-text">
            <span class="action-title">Novo Cliente</span>
            <span class="action-desc">Cadastrar cliente</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" class="action-arrow">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
    </div>

  </div>
</div>
