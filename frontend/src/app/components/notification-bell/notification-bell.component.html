<div class="notif-wrapper" [class.open]="isOpen">

  <!-- Botão sino -->
  <button
    class="header-btn"
    [class.active]="isOpen"
    (click)="toggleDropdown()"
    [attr.aria-expanded]="isOpen"
    aria-label="Notificações"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span class="notif-dot" *ngIf="hasUnread"></span>
  </button>

  <!-- Dropdown -->
  <div class="notif-dropdown" *ngIf="isOpen" role="dialog" aria-label="Notificações">

    <!-- Cabeçalho -->
    <div class="notif-header">
      <span class="notif-header-title">Notificações</span>
      <button class="notif-mark-all" (click)="markAllAsRead()" [disabled]="!hasUnread">
        Marcar todas como lidas
      </button>
    </div>

    <!-- Abas -->
    <div class="notif-tabs">
      <button class="notif-tab" [class.active]="currentTab === 'all'" (click)="setTab('all')">
        Todas
      </button>
      <button class="notif-tab" [class.active]="currentTab === 'unread'" (click)="setTab('unread')">
        Não lidas
        <span class="tab-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </button>
      <button class="notif-tab" [class.active]="currentTab === 'cobrancas'" (click)="setTab('cobrancas')">
        Cobranças
      </button>
    </div>

    <!-- Loading -->
    <div class="notif-loading" *ngIf="loading">
      <span class="spinner"></span>
    </div>

    <!-- Lista -->
    <div class="notif-list" *ngIf="!loading">

      <!-- Vazio -->
      <div class="notif-empty" *ngIf="visibleNotifications.length === 0">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <line x1="2" y1="2" x2="22" y2="22"/>
        </svg>
        <p>Nenhuma notificação aqui</p>
      </div>

      <!-- Items -->
      <div
        class="notif-item"
        *ngFor="let n of visibleNotifications"
        [class.unread]="!n.read_at"
        (click)="markAsRead(n)"
        role="button"
        tabindex="0"
        (keydown.enter)="markAsRead(n)"
      >
        <div class="notif-icon" [ngClass]="iconClass(n.type)">
          <svg *ngIf="n.type === 'cobranca'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          <svg *ngIf="n.type === 'pagamento'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <svg *ngIf="n.type === 'lembrete'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          <svg *ngIf="n.type === 'sistema'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>

        <div class="notif-body">
          <p class="notif-title">{{ n.title }}</p>
          <p class="notif-desc">{{ n.description }}</p>
          <p class="notif-time">{{ n.created_at | date:'dd/MM/yyyy HH:mm' }}</p>
        </div>

        <span class="notif-unread-dot" *ngIf="!n.read_at"></span>
      </div>

    </div>

    <!-- Rodapé -->
    <div class="notif-footer">
      <a routerLink="/notificacoes">Ver todas as notificações →</a>
    </div>

  </div>
</div>
